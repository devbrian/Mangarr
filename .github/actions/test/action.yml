name: Test
description: Runs unit/integration tests

inputs:
  use_postgres:
    description: 'Whether postgres should be used for the database'
  postgres-version:
    description: 'Which postgres version should be used for the database'
  os:
    description: 'OS that the tests are running on'
    required: true
  artifact:
    description: 'Test binary artifact'
    required: true
  pattern:
    description: 'Pattern for DLLs'
    required: true
  filter:
    description: 'Filter for tests'
    required: true
  integration_tests:
    description: 'True if running integration tests'
  automation_tests:
    description: 'True if running Playwright automation (UI) tests'
  binary_artifact:
    description: 'Binary artifact for integration / automation tests'
  binary_path:
    description: 'Path witin binary artifact for integration / automation tests'
  ui_artifact:
    description: 'Built frontend UI artifact for automation (UI) tests'
  # Mangarr-specific divergence from Sonarr's action.yml: discriminator for the
  # automation_tests family (pr-smoke / nightly / liveservice) so their TRX uploads
  # don't collide on the same artifact name across jobs in a run. See DIVERGENCE.md
  # Phase 18 row and the Codex P1 finding on PR #150.
  results_suffix:
    description: 'Optional suffix appended to RESULTS_NAME for cross-job disambiguation (e.g. pr-smoke / nightly / liveservice)'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5

    # /gsd-debug nightly-automation-fail Pattern A fix: GitHub Actions composite-action
    # inputs are STRINGS. In `${{ }}` expressions the string "false" is TRUTHY (only the
    # empty string is falsey), so `if: ${{ inputs.use_postgres }}` runs this step even
    # when callers pass `use_postgres: false`. The sqlite matrix entry of
    # automation_test_nightly then trips the setup-postgres action's empty-version
    # validation and fast-fails the entire job in ~18s. Explicit string comparison
    # `== 'true'` is the canonical pattern for boolean composite-action inputs.
    - name: Setup Postgres
      if: ${{ inputs.use_postgres == 'true' }}
      uses: ikalnytskyi/action-setup-postgres@v8
      with:
        postgres-version: ${{ inputs.postgres-version }}

    # Same truthy-string sweep as the if: guards. Without an explicit comparison,
    # `${{ inputs.use_postgres && '-postgres' }}` resolves to '-postgres' even when
    # use_postgres is the string "false", producing colliding RESULTS_NAME values
    # (e.g. unit-tests-linux-x64-postgres for what should be the sqlite job) and
    # mis-named TRX artifacts.
    #
    # Mangarr divergence: Sonarr upstream has only `integration_tests` and an implicit
    # unit arm, which guarantees unique RESULTS_NAMEs across its 3 job families.
    # Phase 18 added `automation_tests` without extending this formula, so the
    # automation jobs collapsed onto the `unit-` prefix and collided with the real
    # unit_test artifacts (Codex P1 on PR #150). Two-part fix: (1) explicit
    # `automation-` arm parallel to the `integration-` arm; (2) optional
    # `results_suffix` to discriminate within the automation family (pr-smoke /
    # nightly / liveservice).
    - name: Setup Test Variables
      shell: bash
      run: |
        echo "RESULTS_NAME=${{ inputs.automation_tests == 'true' && 'automation-' || (inputs.integration_tests == 'true' && 'integration-' || 'unit-') }}${{ inputs.artifact }}${{ inputs.use_postgres == 'true' && '-postgres' || '' }}${{ inputs.use_postgres == 'true' && inputs.postgres-version && inputs.postgres-version || '' }}${{ inputs.results_suffix != '' && format('-{0}', inputs.results_suffix) || '' }}" >> "$GITHUB_ENV"

    - name: Setup Postgres Environment Variables
      if: ${{ inputs.use_postgres == 'true' }}
      shell: bash
      run: |
        echo "Mangarr__Postgres__Host=localhost" >> "$GITHUB_ENV"
        echo "Mangarr__Postgres__Port=5432" >> "$GITHUB_ENV"
        echo "Mangarr__Postgres__User=postgres" >> "$GITHUB_ENV"
        echo "Mangarr__Postgres__Password=postgres" >> "$GITHUB_ENV"

    - name: Download Artifact
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.artifact }}
        path: _tests

    # CI-infra F11 fix (automation-test-pr-smoke / issue #131): the automation jobs boot a
    # real Mangarr backend via NzbDroneRunner (which execs _tests/bin/Mangarr), exactly like
    # the integration tests do — so the backend-binary download must fire for BOTH
    # integration_tests AND automation_tests. Previously gated on integration_tests only,
    # which left automation_test_pr_smoke with no backend binary
    # (Win32Exception: '_tests/bin/Mangarr' ... No such file or directory).
    #
    # /gsd-debug nightly-automation-fail Pattern A sweep: explicit `== 'true'` for the
    # same truthy-string reason documented at the Setup Postgres step. These two
    # inputs are dormant w.r.t. the original bug (callers only ever pass literal
    # `true`, never `false`), but the sweep removes a latent foot-gun.
    - name: Download Binary Artifact
      if: ${{ inputs.integration_tests == 'true' || inputs.automation_tests == 'true' }}
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.binary_artifact }}
        path: _output

    - name: Set up binary artifact
      if: ${{ inputs.binary_path != '' }}
      shell: bash
      run: mv ./_output/${{inputs.binary_path}} _tests/bin

    # CI-infra FAULT A fix (automation-test-pr-smoke / issue #131): the automation jobs boot
    # the real Mangarr backend, which serves the SPA from <StartUpFolder>/UI relative to the
    # Mangarr binary (IndexHtmlMapper / StaticResourceMapper -> appFolderInfo.StartUpFolder +
    # ConfigFileProvider.UiFolder, where UiFolder == "UI" in Release). The `build` composite
    # action that produces build-linux-x64 is BACKEND-ONLY — it never runs `yarn build`, so the
    # downloaded runtime tree has no UI/ dir. The `frontend` job builds the SPA and uploads it
    # as the `build_ui` artifact (contents of _output/UI/**). Without this step `GET /` 404s,
    # the page title is empty, and AutomationTest.OneTimeSetUpAsync's ToHaveTitleAsync(/Mangarr/)
    # fails on every fixture. integration_test does not need this — it only exercises the API.
    # The binary was just moved to _tests/bin (StartUpFolder), so the UI must land at
    # _tests/bin/UI to be served.
    - name: Download UI Artifact
      if: ${{ inputs.automation_tests == 'true' && inputs.ui_artifact != '' }}
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.ui_artifact }}
        path: _tests/bin/UI

    # CI-infra F11 fix (issue #131): un-gated from integration_tests to also cover
    # automation_tests — the automation jobs exec the same _tests/bin/Mangarr binary.
    - name: Make Mangarr binary executable
      if: ${{ (inputs.integration_tests == 'true' || inputs.automation_tests == 'true') && !startsWith(inputs.os, 'windows') }}
      shell: bash
      run: chmod +x ./_tests/bin/Mangarr

    # CI-infra F4 + F5 fix (ci-test-jobs-latent-faults): actions/upload-artifact +
    # download-artifact do not preserve the Unix executable bit. The test artifact
    # bundles helper executables that the tests launch as child processes:
    #   * Mangarr.Test.Dummy      — ProcessProviderFixture (F4): Should_be_able_to_start_process,
    #                               kill_all_should_kill_all_process_with_name
    #   * ffprobe / ffmpeg        — VideoFileInfoReaderFixture (F5): get_runtime, get_info,
    #                               get_info_unicode. FFProbe.Analyse launches ffprobe from
    #                               AppDomain.BaseDirectory; a non-executable binary throws,
    #                               GetMediaInfo swallows it and returns null, and
    #                               GetRunTime(path).Value then throws "Nullable object must
    #                               have a value".
    # Restore the exec bit on every bundled helper binary before the test run. Mirrors the
    # existing "Make Mangarr binary executable" step that already does this for the
    # integration-test binary. find -exec is a no-op when a given helper is not present in
    # this particular artifact (e.g. ffprobe is win-x64 named ffprobe.exe).
    - name: Make test helper binaries executable
      if: ${{ !startsWith(inputs.os, 'windows') }}
      shell: bash
      run: |
        find ./_tests \( -name 'Mangarr.Test.Dummy' -o -name 'ffprobe' -o -name 'ffmpeg' \) -type f -print -exec chmod +x {} +

    # CI-infra F9 fix (automation-test-pr-smoke / issue #131): the Microsoft.Playwright .NET
    # driver ships its own bundled Node runtime at .playwright/node/<rid>/node. It now reaches
    # the artifact (include-hidden-files: true in publish-test-artifact/action.yml) but
    # actions/download-artifact does not preserve the Unix exec bit on it — same root cause as
    # the F4/F5 helper-binary fix above. This step is AUTOMATION-GATED on purpose: a prior
    # attempt put this chmod in the shared path and it regressed unit_test/unit_test_postgres
    # (making the driver executable there caused PlaywrightSetUpFixture to launch a real
    # browser, and TearDownAsync threw EntryPointNotFoundException). Gating on automation_tests
    # structurally prevents that regression — unit_test/unit_test_postgres/integration_test
    # never pass automation_tests, so this step never runs in their jobs.
    - name: Make Playwright driver executable
      if: ${{ inputs.automation_tests == 'true' && !startsWith(inputs.os, 'windows') }}
      shell: bash
      run: |
        find ./_tests -path '*/.playwright/node/*' -name node -type f -print -exec chmod +x {} +

    # CI-infra fix (automation-test-pr-smoke / issue #131): provision the Playwright browser
    # binaries as their OWN process before the test run. This replaces the in-process
    # `Microsoft.Playwright.Program.Main(["install","chromium"])` call that PlaywrightSetUpFixture
    # used to make — Program.Main is the playwright CLI's process entry point, not a library
    # API, and invoking it inside a live test host left the .NET<->driver transport
    # half-initialized so Playwright.Dispose() later P/Invoked an unbound entry point
    # (System.EntryPointNotFoundException). The supported provisioning path is the generated
    # playwright.ps1 driver script that ships next to the test assemblies; ubuntu-latest
    # runners have pwsh preinstalled. The automation jobs' "Cache Playwright browsers" step
    # restores ~/.cache/ms-playwright, so this is a fast no-op on warm runs.
    - name: Provision Playwright browsers
      if: ${{ inputs.automation_tests == 'true' }}
      shell: pwsh
      working-directory: _tests
      run: ./playwright.ps1 install --with-deps chromium

    - name: Run tests
      shell: bash
      run: dotnet test ./_tests/${{ inputs.pattern }} --filter "${{ inputs.filter }}" --logger "trx;LogFileName=${{ env.RESULTS_NAME }}.trx" --logger "GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true"

    # /gsd-debug gh149-trx-upload-on-cancel: changed `if: ${{ !cancelled() }}` to
    # `if: always()` so the TRX artifact is preserved when a job is cancelled by GH
    # job-timeout (the 60-min ceiling on automation_test_nightly entries flipped the
    # runner to `cancelled` and skipped this step, losing the child Mangarr
    # stdout/stderr captured by AutomationTest.OneTimeSetUpAsync). Safe because
    # upload-artifact@v7 no-ops on missing source paths (dotnet test that crashed
    # before producing any TRX still won't upload), and RESULTS_NAME is already
    # job-scoped so there's no clobbering risk on retries. See issue #149 and the
    # surfacing debug session at .planning/debug/resolved/nightly-automation-fail.md.
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: results-${{ env.RESULTS_NAME }}
        path: TestResults/*.trx
