name: Build

on:
  push:
    branches:
      - v5-develop
      - v5-main
      - Mangarr-v0                       # Phase 18 D-13: per-PR smoke on Mangarr-v0 push
    tags:
      - 'v*'                             # Sonarr divergence: Phase 21 D-06 — release trigger (replaces inherited Sonarr-era *-final pseudo-branch guards); pushed v* tag on Mangarr-v0 triggers the full pipeline + deploy job.
    paths-ignore:
      - ".planning/**"                   # GSD planning docs — no build impact, skip the pipeline
      - "src/Sonarr.Api.*/openapi.json"
  pull_request:
    branches:
      - v5-develop
      - Mangarr-v0                       # Phase 18 D-13: PR-smoke triggers on Mangarr-v0 PRs
    paths-ignore:
      - ".planning/**"                   # GSD planning docs — no build impact, skip the pipeline
      - "src/NzbDrone.Core/Localization/Core/**"
      - "src/Sonarr.Api.*/openapi.json"
  schedule:                              # Phase 18 D-13/D-16 nightly cadences
    - cron: '0 6 * * *'                  # 06:00 UTC — nightly full offline matrix (automation_test_nightly)
    - cron: '0 7 * * *'                  # 07:00 UTC — LiveService tier (automation_test_liveservice)
    - cron: '0 8 * * *'                  # 08:00 UTC — GH #252 orphan-process leak validation (validate_orphan_leaks, windows-latest)
  workflow_dispatch:                     # Allow manual nightly re-run

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FRAMEWORK: net10.0
  RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  MANGARR_MAJOR_VERSION: 1                # Sonarr divergence: was 5 — Phase 21 D-07 reset to v1.0.0 series
  VERSION: 1.1.0                          # Sonarr divergence: was 5.0.0 — Phase 21 D-07 reset; bumped 1.0.0 -> 1.1.0 at Phase 28 close (v1.1 milestone close)

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.variables.outputs.framework }}
      major_version: ${{ steps.variables.outputs.major_version }}
      version: ${{ steps.variables.outputs.version }}
      branch: ${{ steps.variables.outputs.branch }}
    steps:
      - name: Setup Environment Variables
        id: variables
        shell: bash
        run: |
          echo "framework=${{ env.FRAMEWORK }}" >> "$GITHUB_OUTPUT"
          echo "major_version=${{ env.MANGARR_MAJOR_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ env.VERSION }}.$((${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "branch=${RAW_BRANCH_NAME//\//-}" >> "$GITHUB_OUTPUT"

  backend:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: freebsd-x64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-arm
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-arm64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-musl-arm64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-musl-x64
            package_tests: false
            os: ubuntu-latest
          - runtime: linux-x64
            package_tests: true
            os: ubuntu-latest
          - runtime: osx-arm64
            package_tests: true
            os: ubuntu-latest
          - runtime: osx-x64
            package_tests: false
            os: ubuntu-latest
          - runtime: win-x64
            package_tests: true
            os: ubuntu-latest
          - runtime: win-x86
            package_tests: false
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Build
        uses: ./.github/actions/build
        with:
          branch: ${{ needs.prepare.outputs.branch }}
          version: ${{ needs.prepare.outputs.version }}
          framework: ${{ needs.prepare.outputs.framework }}
          runtime: ${{ matrix.runtime }}
          package_tests: ${{ matrix.package_tests }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Volta
        uses: volta-cli/action@v4

      - name: Yarn Install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Stylelint
        run: yarn stylelint -f github

      - name: Build
        run: yarn build --env production

      - name: Publish UI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build_ui
          path: _output/UI/**/*

  unit_test:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # CI-infra F2 fix (ci-test-jobs-latent-faults): TestCategory!=LiveComix excludes the
          # Mangarr.Comix.Live.Test.dll fixtures — they are [LiveComix]-gated, never run in CI
          # (D-17), and would otherwise try to launch a real Chrome that the unit_test job does
          # not provision. scripts/test.sh already excludes Category=LiveComix; this brings the
          # workflow filters into parity.
          - os: ubuntu-latest
            artifact: tests-linux-x64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest&TestCategory!=LiveComix
          - os: macos-latest
            artifact: tests-osx-arm64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest&TestCategory!=LiveComix
          - os: windows-latest
            artifact: tests-win-x64
            filter: TestCategory!=ManualTest&TestCategory!=LINUX&TestCategory!=IntegrationTest&TestCategory!=AutomationTest&TestCategory!=LiveComix
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          artifact: ${{ matrix.artifact }}
          pattern: Mangarr.*.Test.dll
          filter: ${{ matrix.filter }}

  unit_test_postgres:
    needs: backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 17, 18]
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ubuntu-latest
          artifact: tests-linux-x64
          pattern: Mangarr.*.Test.dll
          # CI-infra F2 fix (ci-test-jobs-latent-faults): see unit_test job above.
          # CI-infra F8 fix: &TestCategory!=SqliteOnly excludes mangarr_baselineFixture's
          # SQLite schema-introspection tests (PRAGMA table_info / sqlite_master) — they
          # are SQLite-only by construction. Postgres baseline parity is covered by the
          # mangarr_baseline_postgres_parityFixture ([Category("Postgres")]) which DOES
          # run here.
          filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest&TestCategory!=LiveComix&TestCategory!=SqliteOnly
          use_postgres: true
          postgres-version: ${{ matrix.postgres-version }}

  # Phase 18 — Automated UI Integration Test Suite (Playwright .NET) per CONTEXT.md D-13/D-14/D-15/D-16.
  # New jobs replace the inherited Sonarr Selenium-WebDriver harness (deleted in Plan-02 alongside MainPagesTest.cs per D-19).
  # automation_test_pr_smoke   — PR gate, SQLite only, PRSmoke filter, ~5 min target
  # automation_test_nightly    — full Tier C offline, SQLite + Postgres 16/17/18 matrix, ~30-45 min
  # automation_test_liveservice — nightly contract-invariant probes against real MangaDex/AniList/MAL + comix.to (D-10)
  # See DIVERGENCE.md Phase 18 row (added in Plan-11).
  #
  # CI-infra wiring (automation-test-pr-smoke / issue #131): these jobs pass automation_tests:
  # true to the shared `test` composite action, which (a) downloads the build-linux-x64
  # backend-binary artifact NzbDroneRunner needs (F11), (b) downloads the `build_ui` artifact
  # built by the `frontend` job into _tests/bin/UI so the booted backend can serve the SPA
  # (FAULT A — the `build` action is backend-only and never runs `yarn build`), (c) chmod +x's
  # the bundled Playwright driver Node runtime — automation-gated so it cannot regress
  # unit_test/unit_test_postgres (F9), and (d) provisions chromium via the shipped
  # playwright.ps1 driver script before the test run. The previous in-process
  # `Microsoft.Playwright.Program.Main(["install","chromium"])` call in PlaywrightSetUpFixture
  # was removed — it left the .NET<->driver transport half-initialized. The Playwright
  # IBrowserContext.DisposeAsync() EntryPointNotFoundException (FAULT B) is fixed in
  # Mangarr.Automation.Test.csproj by excluding the runtime asset of the transitive
  # Microsoft.Bcl.AsyncInterfaces reference so the in-box .NET 10 IAsyncDisposable is used.
  # The "Cache Playwright browsers" step is kept so the workflow-side provisioning is a cache
  # hit on warm runs.
  automation_test_pr_smoke:
    needs: [prepare, backend, frontend]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10                   # ~5 min target per D-14, 2× headroom
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Read Playwright version
        id: pw
        shell: bash
        run: |
          PW_VERSION=$(grep -oP 'Microsoft\.Playwright" Version="\K[^"]+' src/NzbDrone.Automation.Test/Mangarr.Automation.Test.csproj | head -1)
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Test
        id: automation_test
        uses: ./.github/actions/test
        with:
          os: ubuntu-latest
          artifact: tests-linux-x64
          pattern: Mangarr.*.Test.dll
          filter: TestCategory=AutomationTest&TestCategory=PRSmoke&TestCategory!=LiveService
          automation_tests: true
          binary_artifact: build-linux-x64
          binary_path: linux-x64/${{ needs.prepare.outputs.framework }}/Mangarr
          ui_artifact: build_ui
          # Codex P1 fix on PR #150 — disambiguate the automation-family TRX artifacts
          # so they don't collide with each other or with unit_test (ubuntu). See
          # .github/actions/test/action.yml inputs.results_suffix.
          results_suffix: pr-smoke
        env:
          # Phase 18 Plan 18-19 (GAP-2): wire offline cassette tier for PR smoke
          # so the per-PR gate stays cassette-free + deterministic. LiveService
          # category is excluded defensively via filter above.
          MANGARR_TEST_CASSETTE_MODE: Replay
          MANGARR_TEST_CASSETTE_DIR: ${{ github.workspace }}/src/NzbDrone.Automation.Test/Fixtures/Cassettes
          # Phase 18 Plan 18-14 D-B: ManagedHttpDispatcher loads the test assembly
          # via Assembly.LoadFrom fallback when AppDomain probe returns null
          # (backend runs in a separate process from the test runner).
          # CI-infra fix (issue #131): publish-test-artifact flattens publish/ to the
          # artifact root, so the test action downloads the DLLs to _tests/ directly —
          # there is no _tests/net10.0/ segment in these jobs.
          MANGARR_TEST_ASSEMBLY_PATH: ${{ github.workspace }}/_tests/Mangarr.Automation.Test.dll

      # Phase 20 D-03 soft-warn (Plan 20-12): surface PR-smoke wall-clock in the PR
      # summary. INFORMATIONAL ONLY — no `exit 1`, no PR-merge block. Per D-03 user
      # explicit preference for signal-without-blocking over hard-fail. Fires even when
      # the test step itself failed (`if: always()`) so a slow-and-failing run still
      # surfaces the wall-clock cost. CEILING is the D-02 10-min ceiling. If observed >
      # CEILING, planner triages which axis-rule-PRSmoke fixtures move to nightly per
      # D-04 (axis-based tiering: PRSmoke = route/req/v5-endpoint(GET-heavy); Nightly =
      # modal-action). v1.x follow-up GH issue tracked in 20-LEARNINGS.md.
      - name: Wall-clock budget warn (Phase 20 D-03)
        if: always()
        shell: bash
        run: |
          DUR_S="${{ steps.automation_test.outputs.duration_seconds }}"
          if [[ -z "$DUR_S" ]]; then
            echo "PR-smoke automation_test wall-clock: unavailable (composite-action output not captured)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DUR_M=$(( DUR_S / 60 ))
          CEILING=10
          echo "PR-smoke automation_test wall-clock: ${DUR_M}m (${DUR_S}s) / ${CEILING}m ceiling" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DUR_M" -gt "$CEILING" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **PR-gate over budget (${DUR_M}m > ${CEILING}m); consider tiering modal-action fixtures to nightly per Phase 20 D-04.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright trace + screenshots + log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-pr-smoke-failure-${{ github.run_id }}
          # CI-infra MINOR fix (issue #131): NzbDroneRunner boots the backend with an
          # ISOLATED AppData under the test directory (_tests/_intg_<uid>/), not the
          # default ~/.config/Mangarr/. Point the backend-log glob at the runner's
          # isolated logs dir so a failing automation run actually ships the backend log.
          path: |
            _tests/traces/**/*.zip
            _tests/screenshots/**/*.png
            _tests/_intg_*/logs/*.txt
          retention-days: 7
          if-no-files-found: ignore

  automation_test_nightly:
    needs: [prepare, backend, frontend]
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60                   # ~30-45 min target per RESEARCH; 60 ceiling
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            use_postgres: false
            postgres-version: ''
          - db: postgres
            use_postgres: true
            postgres-version: 16
          - db: postgres
            use_postgres: true
            postgres-version: 17
          - db: postgres
            use_postgres: true
            postgres-version: 18
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Read Playwright version
        id: pw
        shell: bash
        run: |
          PW_VERSION=$(grep -oP 'Microsoft\.Playwright" Version="\K[^"]+' src/NzbDrone.Automation.Test/Mangarr.Automation.Test.csproj | head -1)
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ubuntu-latest
          artifact: tests-linux-x64
          pattern: Mangarr.*.Test.dll
          filter: TestCategory=AutomationTest&TestCategory!=LiveService
          use_postgres: ${{ matrix.use_postgres }}
          postgres-version: ${{ matrix.postgres-version }}
          automation_tests: true
          binary_artifact: build-linux-x64
          binary_path: linux-x64/${{ needs.prepare.outputs.framework }}/Mangarr
          ui_artifact: build_ui
          # Codex P1 fix on PR #150 — see automation_test_pr_smoke job above.
          results_suffix: nightly
        env:
          # Phase 18 Plan 18-19 (GAP-2): nightly full Tier C also runs offline
          # against cassettes. LiveService tier is segregated to the dedicated
          # automation_test_liveservice job (real APIs).
          MANGARR_TEST_CASSETTE_MODE: Replay
          MANGARR_TEST_CASSETTE_DIR: ${{ github.workspace }}/src/NzbDrone.Automation.Test/Fixtures/Cassettes
          # Phase 18 Plan 18-14 D-B: cross-process assembly load for the
          # backend's HTTP dispatcher (see PR smoke job above for context).
          # CI-infra fix (issue #131): _tests/ root, no net10.0/ segment.
          MANGARR_TEST_ASSEMBLY_PATH: ${{ github.workspace }}/_tests/Mangarr.Automation.Test.dll

      - name: Upload Playwright trace + screenshots + log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-nightly-${{ matrix.db }}${{ matrix.postgres-version }}-failure-${{ github.run_id }}
          # CI-infra MINOR fix (issue #131): isolated NzbDroneRunner AppData log path
          # (see automation_test_pr_smoke job above).
          path: |
            _tests/traces/**/*.zip
            _tests/screenshots/**/*.png
            _tests/_intg_*/logs/*.txt
          retention-days: 14
          if-no-files-found: ignore

  automation_test_liveservice:
    needs: [prepare, backend, frontend]
    if: (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Read Playwright version
        id: pw
        shell: bash
        run: |
          PW_VERSION=$(grep -oP 'Microsoft\.Playwright" Version="\K[^"]+' src/NzbDrone.Automation.Test/Mangarr.Automation.Test.csproj | head -1)
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ubuntu-latest
          artifact: tests-linux-x64
          pattern: Mangarr.*.Test.dll
          filter: TestCategory=AutomationTest&TestCategory=LiveService
          automation_tests: true
          binary_artifact: build-linux-x64
          binary_path: linux-x64/${{ needs.prepare.outputs.framework }}/Mangarr
          ui_artifact: build_ui
          # Codex P1 fix on PR #150 — see automation_test_pr_smoke job above.
          results_suffix: liveservice

      - name: Upload Playwright trace + screenshots + log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-liveservice-failure-${{ github.run_id }}
          # CI-infra MINOR fix (issue #131): isolated NzbDroneRunner AppData log path
          # (see automation_test_pr_smoke job above).
          path: |
            _tests/traces/**/*.zip
            _tests/screenshots/**/*.png
            _tests/_intg_*/logs/*.txt
          retention-days: 30                # Longer retention for upstream-drift forensics per D-10
          if-no-files-found: ignore

  # Phase 18 — Meta-validation gate per CONTEXT.md TEST-UI-01 + TEST-UI-02 + 18-VALIDATION.md
  # §"Meta-Validation: Smoke-the-Smokes" points 1 + 3. No Sonarr upstream analog (mangarr-original).
  inventory_coverage:
    needs: [prepare]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Setup Python (for assertion audit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # gh171 — fast-fail self-test of derive_resource() before the live drift
      # audit runs. A regex/derivation regression surfaces as a clean PASS/FAIL
      # diff against 10 inline cases (all 3 derivation paths + multi-word fallback)
      # instead of as confusing drift output on the main audit. Cheap, runs in <1s.
      - name: Self-test audit-inventory-endpoints.py derive_resource()
        shell: bash
        run: python scripts/audit-inventory-endpoints.py --self-test

      - name: Audit four-axis inventory coverage
        shell: bash
        run: bash scripts/audit-ui-inventory.sh

      - name: Audit state-not-rendering anti-pattern
        shell: bash
        run: bash scripts/audit-test-assertions.sh

  integration_test:
    needs: [prepare, backend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # CI-infra F2 fix (ci-test-jobs-latent-faults): TestCategory!=LiveComix — see unit_test job.
          - os: ubuntu-latest
            artifact: tests-linux-x64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory=IntegrationTest&TestCategory!=LiveComix
            binary_artifact: build-linux-x64
            binary_path: linux-x64/${{ needs.prepare.outputs.framework }}/Mangarr
          - os: macos-latest
            artifact: tests-osx-arm64
            filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory=IntegrationTest&TestCategory!=LiveComix
            binary_artifact: build-osx-arm64
            binary_path: osx-arm64/${{ needs.prepare.outputs.framework }}/Mangarr
          - os: windows-latest
            artifact: tests-win-x64
            filter: TestCategory!=ManualTest&TestCategory!=LINUX&TestCategory=IntegrationTest&TestCategory!=LiveComix
            binary_artifact: build-win-x64
            binary_path: win-x64/${{ needs.prepare.outputs.framework }}/Mangarr
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Test
        uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          artifact: ${{ matrix.artifact }}
          pattern: Mangarr.*.Test.dll
          filter: ${{ matrix.filter }}
          integration_tests: true
          binary_artifact: ${{ matrix.binary_artifact }}
          binary_path: ${{ matrix.binary_path }}

  # GH #252 — orphan-process leak validation (windows-latest). The three leak
  # classes (testhost.exe DLL-lock, Mangarr.Console.exe port-bind, Puppeteer/
  # Playwright Chromium) are WINDOWS-specific (the DLL-lock + Get-Process /
  # kill-orphan-chromium.ps1 surfaces only exist there), so unlike the other
  # automation jobs this one MUST run on a Windows runner. It builds the backend
  # Debug + frontend locally (phase-smoke-gate.sh invokes scripts/test.sh +
  # audit-new-fixtures.sh which compile from source), provisions Playwright, then
  # runs scripts/validate-no-orphan-leaks.sh which exercises phase-smoke-gate.sh
  # back-to-back and asserts every leak class returns to baseline between runs.
  # Iteration count is reduced to 2 here for CI wall-clock budget (the local
  # operator runs 5 per the issue's acceptance criterion 1); the property under
  # test — return-to-baseline after EACH run — is proven at any iteration count.
  validate_orphan_leaks:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read                     # least privilege: only checks out + builds + runs scripts
    steps:
      - name: Check out
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 60000

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Volta
        uses: volta-cli/action@v4

      - name: Read Playwright version
        id: pw
        shell: bash
        run: |
          PW_VERSION=$(grep -oP 'Microsoft\.Playwright" Version="\K[^"]+' src/NzbDrone.Automation.Test/Mangarr.Automation.Test.csproj | head -1)
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Yarn install + build frontend
        shell: bash
        run: |
          yarn install
          yarn build

      - name: Build backend (Debug) + test tree
        shell: bash
        run: |
          dotnet build src/Mangarr.sln --configuration Debug

      - name: Provision Playwright browsers
        shell: pwsh
        run: |
          if (Test-Path _tests/net10.0/playwright.ps1) {
            ./_tests/net10.0/playwright.ps1 install --with-deps chromium
          } else {
            Write-Error "_tests/net10.0/playwright.ps1 not found after build"
            exit 1
          }

      - name: Resolve latest phase number
        id: phase
        shell: bash
        run: |
          # Pick the highest-numbered .planning/phases/<N>-* dir as the smoke-gate
          # target. Emit each leading numeric token on its own line (echo adds the
          # newline, so no backslash-escape is needed), version-sort, take the last.
          chosen=$(
            for d in .planning/phases/*/; do
              name=$(basename "$d")
              num=${name%%-*}
              case "$num" in
                ''|*[!0-9.]*) continue ;;
              esac
              echo "$num"
            done | sort -V | tail -1
          )
          if [ -z "$chosen" ]; then
            echo "FATAL: no .planning/phases/<N>-* directory found" >&2
            exit 1
          fi
          echo "number=$chosen" >> "$GITHUB_OUTPUT"
          echo "Resolved latest phase: $chosen"

      - name: Validate no orphan-process leaks (2 iterations)
        shell: bash
        run: bash scripts/validate-no-orphan-leaks.sh "${{ steps.phase.outputs.number }}" 2 30

  deploy:
    # Sonarr divergence: Phase 21 D-06 — trigger on v* tag push to Mangarr-v0; was inherited Sonarr-era *-final branch-name guards.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      [
        prepare,
        backend,
        frontend,
        unit_test,
        unit_test_postgres,
        integration_test,
      ]
    permissions:
      contents: write                 # reusable deploy.yml release job creates a GitHub release; caller must grant the ceiling (repo default token perms are read-only)
      packages: write                 # Sonarr divergence: Phase 21 D-05 — GHCR push permission for docker_publish job (OIDC via GITHUB_TOKEN; no PAT secret)
      id-token: write                 # Phase 29 D-10 R-6 — cosign keyless OIDC needs id-token mint in docker_publish; caller MUST grant since reusable-workflow permissions are ceiling-gated
    secrets: inherit
    uses: ./.github/workflows/deploy.yml
    with:
      framework: ${{ needs.prepare.outputs.framework }}
      branch: ${{ github.ref_name }}
      major_version: ${{ needs.prepare.outputs.major_version }}
      version: ${{ needs.prepare.outputs.version }}

  # REMOVED Phase 21 D-11: chat-notify job was here (~30 lines in the pre-edit file).
