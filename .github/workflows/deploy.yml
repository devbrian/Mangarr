name: Deploy

on:
  workflow_call:
    inputs:
      framework:
        description: ".net framework"
        type: string
        required: true
      branch:
        description: "Git branch used for this build"
        type: string
        required: true
      major_version:
        description: "Mangarr major version"
        type: string
        required: true
      version:
        description: "Mangarr version"
        type: string
        required: true
    # REMOVED Phase 21 D-10: services-API-key secret no longer used (the upstream-broker push step was removed
    # in this rewrite). See .planning/phases/21-distribution-v1-release/21-CONTEXT.md D-10; Plan 21-05
    # checkpoint:human-verify deletes the orphaned secret from repo Settings → Secrets after this PR merges
    # (RESEARCH Pitfall 7). (Literal secret name + step name intentionally omitted from breadcrumbs so
    # repo-wide grep gates stay clean.)

jobs:
  package:
    strategy:
      matrix:
        include:
          - runtime: freebsd-x64
            os: ubuntu-latest
          - runtime: linux-arm
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest
          - runtime: linux-musl-arm64
            os: ubuntu-latest
          - runtime: linux-musl-x64
            os: ubuntu-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-arm64
            os: ubuntu-latest
          - runtime: osx-x64
            os: ubuntu-latest
          - runtime: win-x64
            os: windows-latest
          - runtime: win-x86
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Package
        uses: ./.github/actions/package
        with:
          framework: ${{ inputs.framework }}
          runtime: ${{ matrix.runtime }}
          artifact: build-${{ matrix.runtime }}
          branch: ${{ inputs.branch }}
          major_version: ${{ inputs.major_version }}
          version: ${{ inputs.version }}

  # Sonarr divergence: new job — Sonarr's deploy.yml has no Docker publish path. Phase 21 D-05 GHCR + D-08 tag stack + Lock #2 multi-arch buildx + Lock #3 OIDC.
  docker_publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # Phase 21 D-05 / Lock #3 — GHCR push via OIDC (no PAT)
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Pitfall 8 (RESEARCH) — branch-reachability guard. on: push: tags trigger is branch-agnostic;
      # this fail-fast asserts the SHA is reachable from origin/Mangarr-v0 before publishing.
      # Fetch full history (--depth=0 → unshallow) so `git branch -r --contains` finds tags pointing
      # at SHAs older than the actions/checkout default 1-commit shallow fetch.
      - name: Verify tag is on Mangarr-v0
        shell: bash
        run: |
          git fetch --unshallow origin Mangarr-v0 2>/dev/null || git fetch origin Mangarr-v0
          if ! git branch -r --contains "${{ github.sha }}" | grep -q 'origin/Mangarr-v0'; then
            echo "::error::Tag points at SHA ${{ github.sha }} not reachable from origin/Mangarr-v0; aborting release."
            exit 1
          fi

      # Q-7 Pattern (a) — download the per-arch artifacts produced by package matrix; Docker build
      # consumes pre-published bits via COPY rather than re-running dotnet publish inside the image.
      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: build-linux-x64
          path: _output/linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: build-linux-arm64
          path: _output/linux-arm64

      # Q-3 Pattern A — QEMU multi-arch via buildx on a single ubuntu-latest runner.
      # Native arm64 runner (ubuntu-24.04-arm Pattern B) is a v1.x optimization.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Lock #3 — GHCR OIDC via GITHUB_TOKEN; no PAT secret required.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pitfall 3 — flavor: latest=false + explicit type=raw,value=latest,enable=<stable-tag only>.
      # Prevents a pre-release tag from silently rolling :latest. The branch-reachability guard
      # above already fail-fasts tags not on Mangarr-v0, so the only remaining filter is "is this
      # a stable v1+ tag?" — gate on a numeric (non-prerelease) v1.X.Y.Z shape. v0.x and any tag
      # carrying -alpha / -beta / -rc suffix is excluded.
      # D-08 — full hotio-style 5-tag stack: 1.0.0.42 + 1.0.0 + 1.0 + 1 + latest.
      # NOTE: was `inputs.branch == 'Mangarr-v0'` but build_v5.yml passes `github.ref_name` which on
      # tag triggers is the TAG (e.g. v1.0.0.42), never `Mangarr-v0` — the equality was always false
      # in production, so `:latest` was never emitted. Switched to a regex on the tag itself.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devbrian/mangarr
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            # Patterns must include the leading `v` because `value=v${{ inputs.version }}`
            # produces strings like `v1.0.0.42`. Earlier patterns omitted the `v` and silently
            # never matched in production — the 3 alias tags (1.0.0, 1.0, 1) were never emitted,
            # only the bare 4-part `1.0.0.42` was published. CodeRabbit #22 catch.
            type=match,pattern=^v(\d+\.\d+\.\d+)\.\d+$,group=1,value=v${{ inputs.version }}
            type=match,pattern=^v(\d+\.\d+)\.\d+\.\d+$,group=1,value=v${{ inputs.version }}
            type=match,pattern=^v(\d+)\.\d+\.\d+\.\d+$,group=1,value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ startsWith(inputs.branch, 'v1.') || startsWith(inputs.branch, 'v2.') || startsWith(inputs.branch, 'v3.') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MANGARR_VERSION=${{ inputs.version }}

      # D-04 layer 2 — boot-smoke the just-pushed image; assert HTTP 200 at /api/v5/system/status
      # before declaring the publish successful. scripts/docker-smoke.sh ships from Plan 21-02.
      - name: Boot-smoke (D-04 layer 2)
        shell: bash
        run: bash scripts/docker-smoke.sh --image ghcr.io/devbrian/mangarr:${{ inputs.version }}

  release:
    needs: [package, docker_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Pitfall 8 (RESEARCH) — branch-reachability guard. Same fail-fast as docker_publish; release
      # creation should never proceed from a SHA not reachable from origin/Mangarr-v0. Fetch full
      # history (--unshallow) so older tag SHAs are still found by `git branch -r --contains`.
      - name: Verify tag is on Mangarr-v0
        shell: bash
        run: |
          git fetch --unshallow origin Mangarr-v0 2>/dev/null || git fetch origin Mangarr-v0
          if ! git branch -r --contains "${{ github.sha }}" | grep -q 'origin/Mangarr-v0'; then
            echo "::error::Tag points at SHA ${{ github.sha }} not reachable from origin/Mangarr-v0; aborting release."
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts
          pattern: release-*
          merge-multiple: true

      # Lock #4 + Pitfall 5 — defensive single-source resolution. For v1.0.0.<N> tags we use the
      # hand-curated RELEASE-NOTES-v1.0.0.md bodyFile (D-12); for v1.0.0.N+ follow-ups we fall back
      # to the existing actions/github-script generateReleaseNotes flow. NEVER pass both body and
      # bodyFile non-empty at the same time.
      - name: Determine release-notes source
        id: notes-source
        shell: bash
        run: |
          # build_v5.yml prepare step produces 4-part `inputs.version` (1.0.0.<run_number>),
          # so the release tag built here is `v1.0.0.<run>`. Accept the 3-part form too in
          # case a future prepare-step change shortens it (CodeRabbit #23 defensive guard).
          tag="v${{ inputs.version }}"
          if [[ "$tag" =~ ^v1\.0\.0(\.[0-9]+)?$ ]]; then
            echo "use_file=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_file=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Previous Release
        id: previous-release
        if: steps.notes-source.outputs.use_file == 'false'
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          latest: true
          # Was `inputs.branch != 'Mangarr-v0'` — always true in production because build_v5.yml
          # passes `github.ref_name` (the tag) and the branch-reachability guard above already
          # blocks unreachable tags. Mark stable v1+/v2+/v3+ tags as non-prerelease; everything
          # else (e.g. v0.x or feature/release-candidate tags) stays prerelease.
          prerelease: ${{ !(startsWith(inputs.branch, 'v1.') || startsWith(inputs.branch, 'v2.') || startsWith(inputs.branch, 'v3.')) }}

      - name: Generate Release Notes
        id: generate-release-notes
        if: steps.notes-source.outputs.use_file == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v${{ inputs.version }}',
              target_commitish: '${{ github.sha }}',
              previous_tag_name: '${{ steps.previous-release.outputs.tag_name }}',
            })
            return data.body

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: _artifacts/Mangarr.*
          commit: ${{ github.sha }}
          generateReleaseNotes: false
          bodyFile: ${{ steps.notes-source.outputs.use_file == 'true' && 'RELEASE-NOTES-v1.0.0.md' || '' }}
          body: ${{ steps.notes-source.outputs.use_file == 'false' && steps.generate-release-notes.outputs.result || '' }}
          name: ${{ inputs.version }}
          # Was `inputs.branch != 'Mangarr-v0'` — always true in production because build_v5.yml
          # passes `github.ref_name` (the tag) and the branch-reachability guard above already
          # blocks unreachable tags. Mark stable v1+/v2+/v3+ tags as non-prerelease; everything
          # else (e.g. v0.x or feature/release-candidate tags) stays prerelease.
          prerelease: ${{ !(startsWith(inputs.branch, 'v1.') || startsWith(inputs.branch, 'v2.') || startsWith(inputs.branch, 'v3.')) }}
          skipIfReleaseExists: true
          tag: v${{ inputs.version }}

      # REMOVED Phase 21 D-10: the upstream-broker publish step was here (lines 120-171 of the pre-edit file).
      # The deleted step POSTed a hash manifest to a Sonarr-era update endpoint; no Mangarr equivalent
      # exists at v1.0.0. GitHub Releases is the v1.0.0 update source-of-truth. An in-app update broker is
      # a v1.x consideration per .planning/phases/21-distribution-v1-release/21-CONTEXT.md Deferred Ideas.
      # See also: services-API-key secret removal at the workflow_call inputs block above
      # (RESEARCH Pitfall 7 — Plan 21-05 deletes the orphaned secret from repo Settings).
      # (Literal step name + secret name + upstream endpoint intentionally omitted so repo-wide grep
      # gates in Task 4 stay clean.)
