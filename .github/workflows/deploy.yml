name: Deploy

on:
  workflow_call:
    inputs:
      framework:
        description: ".net framework"
        type: string
        required: true
      branch:
        description: "Git branch used for this build"
        type: string
        required: true
      major_version:
        description: "Mangarr major version"
        type: string
        required: true
      version:
        description: "Mangarr version"
        type: string
        required: true
    # REMOVED Phase 21 D-10: services-API-key secret no longer used (the upstream-broker push step was removed
    # in this rewrite). See .planning/phases/21-distribution-v1-release/21-CONTEXT.md D-10; Plan 21-05
    # checkpoint:human-verify deletes the orphaned secret from repo Settings → Secrets after this PR merges
    # (RESEARCH Pitfall 7). (Literal secret name + step name intentionally omitted from breadcrumbs so
    # repo-wide grep gates stay clean.)

jobs:
  package:
    strategy:
      matrix:
        include:
          - runtime: freebsd-x64
            os: ubuntu-latest
          - runtime: linux-arm
            os: ubuntu-24.04-arm           # Phase 29 D-13 — native arm64 runner (CI wall-time only)
          - runtime: linux-arm64
            os: ubuntu-24.04-arm           # Phase 29 D-13 — native arm64 runner (CI wall-time only)
          - runtime: linux-musl-arm64
            os: ubuntu-24.04-arm           # Phase 29 D-13 — native arm64 runner (CI wall-time only)
          - runtime: linux-musl-x64
            os: ubuntu-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-arm64
            os: ubuntu-latest
          - runtime: osx-x64
            os: ubuntu-latest
          - runtime: win-x64
            os: windows-latest
          - runtime: win-x86
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Package
        uses: ./.github/actions/package
        with:
          framework: ${{ inputs.framework }}
          runtime: ${{ matrix.runtime }}
          artifact: build-${{ matrix.runtime }}
          branch: ${{ inputs.branch }}
          major_version: ${{ inputs.major_version }}
          version: ${{ inputs.version }}

  # Sonarr divergence: new job — Sonarr's deploy.yml has no Docker publish path. Phase 21 D-05 GHCR + D-08 tag stack + Lock #2 multi-arch buildx + Lock #3 OIDC.
  docker_publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # Phase 21 D-05 / Lock #3 — GHCR push via OIDC (no PAT)
      id-token: write                 # Phase 29 D-10 R-6 — cosign keyless OIDC token mint
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Pitfall 8 (RESEARCH) — branch-reachability guard. on: push: tags trigger is branch-agnostic;
      # this fail-fast asserts the SHA is reachable from origin/Mangarr-v0 before publishing.
      # Fetch full history (--depth=0 → unshallow) so `git branch -r --contains` finds tags pointing
      # at SHAs older than the actions/checkout default 1-commit shallow fetch.
      - name: Verify tag is on Mangarr-v0
        shell: bash
        run: |
          git fetch --unshallow origin Mangarr-v0 2>/dev/null || git fetch origin Mangarr-v0
          if ! git branch -r --contains "${{ github.sha }}" | grep -q 'origin/Mangarr-v0'; then
            echo "::error::Tag points at SHA ${{ github.sha }} not reachable from origin/Mangarr-v0; aborting release."
            exit 1
          fi

      # Q-7 Pattern (a) — download the per-arch artifacts produced by package matrix; Docker build
      # consumes pre-published bits via COPY rather than re-running dotnet publish inside the image.
      #
      # Artifact layout: .github/actions/build/action.yml uploads with
      # `path: _artifacts/**/*`. The Package step has previously copied the publish
      # output into `_artifacts/linux-x64/net10.0/Mangarr/{flat files}`. upload-artifact@v7
      # strips the `_artifacts/` prefix but PRESERVES the rest of the directory structure
      # — so the artifact contents are `linux-x64/net10.0/Mangarr/Mangarr` etc., not flat.
      #
      # Without the flatten step below, `COPY _output/linux-${TARGETARCH}/ /app/` would place
      # files at `/app/linux-x64/net10.0/Mangarr/Mangarr` and the s6 longrun script would fail
      # with `s6-applyuidgid: fatal: unable to exec /app/Mangarr: No such file or directory`.
      # Verified empirically against PR #196 → v1.0.0 deploy run 25980293162 (boot-smoke).
      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: build-linux-x64
          path: _output/linux-x64-raw

      - name: Flatten linux-x64 artifact for Dockerfile COPY
        shell: bash
        run: |
          set -euo pipefail
          src="_output/linux-x64-raw/linux-x64/net10.0/Mangarr"
          dst="_output/linux-amd64"
          [ -d "$src" ] || { echo "::error::Artifact layout changed — expected '$src' but it does not exist."; ls -la _output/linux-x64-raw/ || true; exit 1; }
          mkdir -p "$dst"
          cp -r "$src"/. "$dst"/
          # upload-artifact@v7 strips POSIX exec bits during pack/unpack — the ELF
          # binaries arrive at mode 0644. Restore +x on the entrypoint host (Mangarr),
          # the .NET crash-dump helper (createdump), and the self-update binary
          # (Mangarr.Update/Mangarr.Update) so the runtime image can actually invoke
          # them. Without this the s6 longrun script fails with
          #   s6-applyuidgid: fatal: unable to exec /app/Mangarr: No such file or directory
          # (POSIX exec gives ENOENT when the file exists but has no x bit — the same
          # symptom as a missing file from the shell's perspective).
          [ -f "$dst/Mangarr" ] || { echo "::error::Mangarr ELF binary missing from flattened output at '$dst/Mangarr'."; ls -la "$dst" | head; exit 1; }
          chmod +x "$dst/Mangarr"
          [ -f "$dst/createdump" ] && chmod +x "$dst/createdump" || true
          [ -f "$dst/Mangarr.Update/Mangarr.Update" ] && chmod +x "$dst/Mangarr.Update/Mangarr.Update" || true
          echo "Flattened $(find "$dst" -type f | wc -l) files into $dst (entrypoint: $(file -b "$dst/Mangarr"))"

      # v1.0.0 ships amd64-only (see "Build and push multi-arch image" step
      # below for full rationale). The build-linux-arm64 artifact is still
      # produced by the per-runtime backend matrix because it's attached as a
      # bonus runtime archive to the GitHub Release in the `release` job
      # downstream — but the docker_publish job does not consume it. Re-enable
      # this download when v1.1-17 lands a real arm64 headless-browser path.
      # - name: Download linux-arm64 artifact
      #   uses: actions/download-artifact@v8
      #   with:
      #     name: build-linux-arm64
      #     path: _output/linux-arm64

      # The `frontend` job (build_v5.yml:127-131) builds the SPA via yarn build and
      # uploads as the `build_ui` artifact. The runtime image needs it baked in or
      # `/` returns 404 (only `/api/v5/*` endpoints work). Phase 21 local end-to-end
      # smoke caught this when /initialize.json returned 200 but `/` returned 404.
      - name: Download frontend SPA artifact
        uses: actions/download-artifact@v8
        with:
          name: build_ui
          path: _output/UI

      # Q-3 Pattern A — QEMU multi-arch via buildx on a single ubuntu-latest runner.
      # Native arm64 runner (ubuntu-24.04-arm Pattern B) is a v1.x optimization.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Lock #3 — GHCR OIDC via GITHUB_TOKEN; no PAT secret required.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pitfall 3 — flavor: latest=false + explicit type=raw,value=latest,enable=<stable-tag only>.
      # Prevents a pre-release tag from silently rolling :latest. The branch-reachability guard
      # above already fail-fasts tags not on Mangarr-v0, so the only remaining filter is "is this
      # a stable v1+ tag?" — gate on a numeric (non-prerelease) v1.X.Y.Z shape. v0.x and any tag
      # carrying -alpha / -beta / -rc suffix is excluded.
      # D-08 — full hotio-style 5-tag stack: 1.0.0.42 + 1.0.0 + 1.0 + 1 + latest.
      # NOTE: was `inputs.branch == 'Mangarr-v0'` but build_v5.yml passes `github.ref_name` which on
      # tag triggers is the TAG (e.g. v1.0.0.42), never `Mangarr-v0` — the equality was always false
      # in production, so `:latest` was never emitted. Switched to a regex on the tag itself.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devbrian/mangarr
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            # Patterns must include the leading `v` because `value=v${{ inputs.version }}`
            # produces strings like `v1.0.0.42`. Earlier patterns omitted the `v` and silently
            # never matched in production — the 3 alias tags (1.0.0, 1.0, 1) were never emitted,
            # only the bare 4-part `1.0.0.42` was published. CodeRabbit #22 catch.
            type=match,pattern=^v(\d+\.\d+\.\d+)\.\d+$,group=1,value=v${{ inputs.version }}
            type=match,pattern=^v(\d+\.\d+)\.\d+\.\d+$,group=1,value=v${{ inputs.version }}
            type=match,pattern=^v(\d+)\.\d+\.\d+\.\d+$,group=1,value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ startsWith(inputs.branch, 'v1.') || startsWith(inputs.branch, 'v2.') || startsWith(inputs.branch, 'v3.') }}

      # v1.0.0 ships amd64-only — see RELEASE-NOTES "Known limitations" and
      # .planning/v1.1-roadmap.md v1.1-17 for full context.
      #
      # Root cause: PuppeteerSharp 24.42's BrowserFetcher.DownloadAsync with
      # Platform.LinuxArm64 silently downloads the x86_64 Chrome binary because
      # Chrome for Testing does not ship an arm64 Linux build (verified upstream
      # at https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json
      # — Chrome platforms are linux64 | mac-arm64 | mac-x64 | win32 | win64
      # only; no linux-arm64). The arm64 runtime stage COPYed an x86_64 binary
      # and `chrome --version` failed with `not found` (shell-level translation
      # of "ELF arch mismatch, no ld for this format"; the ELF e_machine field
      # was 0x003E = EM_X86_64, not 0xB7 = EM_AARCH64).
      #
      # arm64 hosts can pull the amd64 image via Docker's user-mode emulation:
      #   docker pull --platform linux/amd64 ghcr.io/devbrian/mangarr:1.0.0
      #
      # v1.1-17 evaluates real arm64 paths: (a) switch to Playwright .NET whose
      # CLI ships arm64 chromium, (b) hybrid with apt-chromium on arm64
      # (relaxes Phase 17 D-02), or (c) build chromium-headless-shell from
      # source for arm64. None of those fit the v1.0.0 ship window.
      #
      # The arch-aware chromium-builder scaffolding (--platform=$BUILDPLATFORM,
      # TARGETARCH → PS_PLATFORM dispatch in distribution/docker/Dockerfile +
      # tools/ChromiumPrefetch/Program.cs --platform arg) is retained as
      # foundation for whichever v1.1-17 path lands.
      # Phase 29 D-09 — install cosign for keyless OIDC sign + self-verify.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MANGARR_VERSION=${{ inputs.version }}

      # Phase 29 D-09 — cosign keyless OIDC sign of the just-pushed image digest.
      # --yes suppresses interactive tlog confirmation; the keyless OIDC token is
      # auto-discovered from the workflow's id-token claim (permissions block above).
      - name: Cosign sign multi-arch image
        shell: bash
        run: cosign sign --yes ghcr.io/devbrian/mangarr@${{ steps.build.outputs.digest }}

      # Phase 29 D-10 + T-29-01-01 mitigation — cosign self-verify immediately
      # after sign so the workflow itself proves "cosign signed but bundle didn't
      # land on GHCR" cannot pass. --certificate-identity-regexp (not -identity)
      # anchors to ^https://github.com/devbrian/Mangarr/.github/workflows/deploy.yml@refs/.*$
      # so the same step works for both initial release tags and throwaway tag
      # re-pushes against the same merge commit (Plan 29-03). A signature minted
      # by a malicious forked workflow cannot pass because its identity claim
      # would not match the regex anchored to devbrian/Mangarr.
      - name: Cosign self-verify
        shell: bash
        run: |
          cosign verify ghcr.io/devbrian/mangarr@${{ steps.build.outputs.digest }} \
            --certificate-identity-regexp "^https://github\.com/devbrian/Mangarr/\.github/workflows/deploy\.yml@refs/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Phase 29 D-11 / DIST2-02 — generate SPDX-JSON SBOM via syft against the
      # just-pushed image digest. Output filename matches ROADMAP SC#2 exact
      # string `mangarr-<version>-sbom.spdx.json`.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (syft, SPDX-JSON)
        shell: bash
        run: |
          syft ghcr.io/devbrian/mangarr@${{ steps.build.outputs.digest }} \
            -o spdx-json=mangarr-${{ inputs.version }}-sbom.spdx.json

      # Phase 29 D-11 — round-trip the SBOM artifact from docker_publish → release
      # so the release-action artifacts glob (line 332) can attach it to the
      # GitHub Release. T-29-01-04 disposition `accept` — workflow-scoped artifact
      # storage is auth-scoped per workflow run; same trust boundary as the
      # existing _artifacts/Mangarr.* glob.
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: mangarr-${{ inputs.version }}-sbom.spdx.json

      # D-04 layer 2 — boot-smoke the just-pushed image; assert HTTP 200 at /api/v5/system/status
      # before declaring the publish successful. scripts/docker-smoke.sh ships from Plan 21-02.
      - name: Boot-smoke (D-04 layer 2)
        shell: bash
        run: bash scripts/docker-smoke.sh --image ghcr.io/devbrian/mangarr:${{ inputs.version }}

  release:
    needs: [package, docker_publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Pitfall 8 (RESEARCH) — branch-reachability guard. Same fail-fast as docker_publish; release
      # creation should never proceed from a SHA not reachable from origin/Mangarr-v0. Fetch full
      # history (--unshallow) so older tag SHAs are still found by `git branch -r --contains`.
      - name: Verify tag is on Mangarr-v0
        shell: bash
        run: |
          git fetch --unshallow origin Mangarr-v0 2>/dev/null || git fetch origin Mangarr-v0
          if ! git branch -r --contains "${{ github.sha }}" | grep -q 'origin/Mangarr-v0'; then
            echo "::error::Tag points at SHA ${{ github.sha }} not reachable from origin/Mangarr-v0; aborting release."
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts
          pattern: release-*
          merge-multiple: true

      # Phase 29 D-11 — download the SBOM produced by docker_publish so the
      # release-action artifacts glob can attach it to the GitHub Release.
      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom

      # Lock #4 + Pitfall 5 — defensive single-source resolution. For v1.0.0.<N> tags we use the
      # hand-curated RELEASE-NOTES-v1.0.0.md bodyFile (D-12); for v1.0.0.N+ follow-ups we fall back
      # to the existing actions/github-script generateReleaseNotes flow. NEVER pass both body and
      # bodyFile non-empty at the same time.
      - name: Determine release-notes source
        id: notes-source
        shell: bash
        run: |
          # build_v5.yml prepare step produces 4-part `inputs.version` (<MAJOR>.<MINOR>.0.<run_number>),
          # so the release tag built here is `v<MAJOR>.<MINOR>.0.<run>`. Accept the 3-part base too.
          # Phase 28 D-19 generalization: hand-curated RELEASE-NOTES-v<MAJOR>.<MINOR>.0.md if present,
          # else fall through to actions/github-script generateReleaseNotes (Phase 21 D-12 fallback).
          tag="v${{ inputs.version }}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.0(\.[0-9]+)?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            notes_file="RELEASE-NOTES-v${major}.${minor}.0.md"
            if [[ -f "$notes_file" ]]; then
              echo "use_file=true" >> "$GITHUB_OUTPUT"
              echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
            else
              echo "use_file=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "use_file=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Previous Release
        id: previous-release
        if: steps.notes-source.outputs.use_file == 'false'
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          latest: true
          # Was `inputs.branch != 'Mangarr-v0'` — always true in production because build_v5.yml
          # passes `github.ref_name` (the tag) and the branch-reachability guard above already
          # blocks unreachable tags. Mark stable v1+/v2+/v3+ tags as non-prerelease; everything
          # else (e.g. v0.x or feature/release-candidate tags) stays prerelease.
          prerelease: ${{ !(startsWith(inputs.branch, 'v1.') || startsWith(inputs.branch, 'v2.') || startsWith(inputs.branch, 'v3.')) }}

      - name: Generate Release Notes
        id: generate-release-notes
        if: steps.notes-source.outputs.use_file == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v${{ inputs.version }}',
              target_commitish: '${{ github.sha }}',
              previous_tag_name: '${{ steps.previous-release.outputs.tag_name }}',
            })
            return data.body

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          # Phase 29 D-11 — attach SPDX-JSON SBOM alongside the existing runtime archives
          # per ROADMAP SC#2 ("attached to the GitHub Release for that version"). The
          # filename `mangarr-${{ inputs.version }}-sbom.spdx.json` is the exact-string
          # ROADMAP SC#2 requirement.
          artifacts: _artifacts/Mangarr.*,mangarr-${{ inputs.version }}-sbom.spdx.json
          commit: ${{ github.sha }}
          generateReleaseNotes: false
          bodyFile: ${{ steps.notes-source.outputs.use_file == 'true' && steps.notes-source.outputs.notes_file || '' }}
          body: ${{ steps.notes-source.outputs.use_file == 'false' && steps.generate-release-notes.outputs.result || '' }}
          name: ${{ inputs.version }}
          # Was `inputs.branch != 'Mangarr-v0'` — always true in production because build_v5.yml
          # passes `github.ref_name` (the tag) and the branch-reachability guard above already
          # blocks unreachable tags. Mark stable v1+/v2+/v3+ tags as non-prerelease; everything
          # else (e.g. v0.x or feature/release-candidate tags) stays prerelease.
          prerelease: ${{ !(startsWith(inputs.branch, 'v1.') || startsWith(inputs.branch, 'v2.') || startsWith(inputs.branch, 'v3.')) }}
          skipIfReleaseExists: true
          tag: v${{ inputs.version }}

      # REMOVED Phase 21 D-10: the upstream-broker publish step was here (lines 120-171 of the pre-edit file).
      # The deleted step POSTed a hash manifest to a Sonarr-era update endpoint; no Mangarr equivalent
      # exists at v1.0.0. GitHub Releases is the v1.0.0 update source-of-truth. An in-app update broker is
      # a v1.x consideration per .planning/phases/21-distribution-v1-release/21-CONTEXT.md Deferred Ideas.
      # See also: services-API-key secret removal at the workflow_call inputs block above
      # (RESEARCH Pitfall 7 — Plan 21-05 deletes the orphaned secret from repo Settings).
      # (Literal step name + secret name + upstream endpoint intentionally omitted so repo-wide grep
      # gates in Task 4 stay clean.)

  # Phase 29 D-14 / DIST2-05 — Discord notify scaffolding. Useless without a
  # Mangarr Discord channel today, but flipping `DISCORD_WEBHOOK` secret on later
  # turns it on without re-touching deploy.yml.
  #
  # Two-layer gate per T-29-01-02 mitigation:
  #   1. Step-level `if: env.DISCORD_WEBHOOK != ''` — skip the notify step when
  #      the secret is absent (job runs but no-ops cleanly). GitHub Actions
  #      forbids `secrets` context in job-level `if:` expressions, so the gate
  #      MUST be evaluated at the step level via a job-level `env:` mapping.
  #   2. `continue-on-error: true` — second belt: if the webhook POST itself
  #      fails (404 / rate-limited / channel deleted), the workflow as a whole
  #      stays green.
  #
  # Webhook URL is mapped to job-level env from the secret, then read by the
  # step `env:` block (which receives the same value). GitHub Actions masks the
  # secret value in logs as a third defense.
  discord_notify:
    name: Discord Release Notification
    needs: [release]
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Post release notification to Discord
        if: env.DISCORD_WEBHOOK != ''
        shell: bash
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"Mangarr v${{ inputs.version }} released: https://github.com/devbrian/Mangarr/releases/tag/v${{ inputs.version }}\"}" \
            "$DISCORD_WEBHOOK"
