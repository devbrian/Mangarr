name: Source Soak (Daily)

on:
  schedule:
    - cron: '0 4 * * *'      # 04:00 UTC daily; D-16 / Discretion suggested
  workflow_dispatch:           # manual re-run for missed days (Pitfall 9)
  pull_request:
    paths:
      - 'src/NzbDrone.Core/Indexers/MangaDex/**'
      - 'src/NzbDrone.Core/Indexers/Comix/**'
      - 'scripts/soak/**'

env:
  FRAMEWORK: net10.0
  # 2-source slate per Phase 3 D-19 (third-source descope)
  SOURCES: 'mangadex comix.to'
  SMOKE_TITLES: 'One Piece;Berserk;Solo Leveling'

jobs:
  soak:
    runs-on: ubuntu-latest      # GH Actions runner = datacenter IP per D-16
    permissions:
      contents: write           # to commit SOURCE-PROBE-{slug}.md updates
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Mangarr Core
        # WR-09 mitigation: csproj was renamed Sonarr.Core.csproj → Mangarr.Core.csproj
        # during the Sonarr→Mangarr migration. The workflow's stale path failed every
        # daily soak at the build step, masking Phase 17 live-Comix smoke results
        # downstream.
        run: dotnet build src/NzbDrone.Core/Mangarr.Core.csproj --configuration Release --nologo

      - name: Run soak harness
        id: soak
        run: |
          dotnet run --project scripts/soak/SoakRunner.csproj --configuration Release -- \
            --sources "${{ env.SOURCES }}" \
            --titles  "${{ env.SMOKE_TITLES }}" \
            --output  ".planning/phases/03-indexer-contract-aggregator-sources/"
        # No secrets needed for v1 unauthenticated public APIs.
        # If MangaDex OAuth tier-up is needed for higher rate budget in v1.x, add:
        #   MANGADEX_CLIENT_ID: ${{ secrets.MANGADEX_CLIENT_ID }}

      - name: Commit SOURCE-PROBE updates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'mangarr-soak-bot'
          git config user.email 'soak-bot@users.noreply.github.com'
          git add .planning/phases/03-indexer-contract-aggregator-sources/SOURCE-PROBE-*.md
          git diff --cached --quiet || git commit -m "chore(soak): append daily soak result $(date -u +%Y-%m-%d) [skip ci]"
          git push || echo "push skipped (branch protection or no changes)"

      - name: Soak threshold check
        run: |
          dotnet run --project scripts/soak/SoakThresholdChecker.csproj --configuration Release -- \
            --window 7 --threshold 0.05 \
            --probe-dir .planning/phases/03-indexer-contract-aggregator-sources/

      # ── Phase 17 D-19 — daily-soak drift detection for the Comix runtime signer ──
      # Per .planning/phases/17-comix-runtime-signer-port-puppeteersharp/17-CONTEXT.md.
      # Extends the existing per-source soak schedule to run the live-Chromium
      # integration fixture; surfaces probe-failure rate spikes after a comix.to
      # deploy. NO new workflow file, NO new cron — drift detection rides the
      # existing schedule. Steps land INSIDE jobs.soak.steps array per Plan 17-04
      # Task 2 (revision iteration 1, B-1: explicit structural targeting).
      #
      # Gated on schedule + workflow_dispatch (manual rerun) — PR runs still skip these
      # to keep PR runs fast, but a manual `gh workflow run source-soak.yml` can now
      # exercise the live signer fixture without waiting 24h for the next cron.
      # Phase 33.3: provision Chromium via Microsoft.Playwright .NET (the signer's
      # browser layer was ported off PuppeteerSharp). `playwright.ps1` ships in the
      # build output; `install --with-deps` apt-installs the browser sys-deps too.
      # xvfb is added separately because the signer runs HEADED (comix.to's Cloudflare
      # managed challenge does NOT clear headless — the smoke runs under xvfb-run).
      - name: Provision Playwright Chromium + Xvfb (Phase 33.3 live signer test)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
          dotnet build src/Mangarr.Comix.Live.Test/Mangarr.Comix.Live.Test.csproj --configuration Release
          pwsh src/Mangarr.Comix.Live.Test/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run live Comix signer smoke
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          xvfb-run -a dotnet test src/Mangarr.Comix.Live.Test/Mangarr.Comix.Live.Test.csproj \
            --configuration Release \
            --no-build \
            --filter "Category=LiveComix" \
            --logger "trx;LogFileName=live-comix.trx" \
            || (echo "::warning::Phase 17 live-Comix smoke FAILED — comix.to may have rotated; investigate keiyoushi commit log for fresh Signer.kt updates" && exit 1)

      - name: Upload live-Comix test results
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && always()
        uses: actions/upload-artifact@v4
        with:
          name: live-comix-trx-${{ github.run_id }}
          path: '**/live-comix.trx'
          if-no-files-found: ignore
