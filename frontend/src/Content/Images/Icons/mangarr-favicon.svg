<?xml version="1.0" encoding="UTF-8"?>
<!--
  Phase 7 Plan 07-11 — Mangarr SVG favicon.
  Modern browsers prefer SVG favicons over .ico. The legacy favicon.ico is
  retained for Internet Explorer / older fallbacks; modern browsers pick this
  SVG up first via the <link rel="icon" type="image/svg+xml"> directive in index.ejs.
  Manga pink accent (#f06292) per UI-SPEC §Color.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mangarr">
  <!-- Round pink background to maximize legibility at favicon sizes -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="#f06292"/>
  <!-- Stylized open-book glyph in white for high contrast -->
  <g fill="#ffffff" stroke="none">
    <!-- Left page -->
    <path d="M10 16 L10 50 L30 54 L30 20 Z" />
    <!-- Right page -->
    <path d="M34 20 L34 54 L54 50 L54 16 Z" opacity="0.95" />
    <!-- Spine accent -->
    <rect x="30" y="16" width="4" height="38" />
  </g>
</svg>
