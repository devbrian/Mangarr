<?xml version="1.0" encoding="UTF-8"?>
<!--
  Phase 7 Plan 07-11 — Mangarr light-variant wordmark.
  Used on dark page header backgrounds (dark theme nav bg #2a2a2a).
  Manga pink fill (#f06292) per UI-SPEC §Logo asset spec + §Color (themeBlue accent).
  Open-book glyph (left) + Mangarr wordmark (right) — Roboto bold, viewBox 0 0 200 32.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 32" width="200" height="32" role="img" aria-label="Mangarr">
  <!-- Open book glyph: simplified two-page silhouette in manga pink -->
  <g fill="#f06292" stroke="none">
    <!-- Left page -->
    <path d="M2 6 L2 26 L14 28 L14 8 Z" />
    <!-- Right page (slightly offset to suggest right-to-left manga reading) -->
    <path d="M16 8 L16 28 L28 26 L28 6 Z" opacity="0.85" />
    <!-- Spine accent -->
    <rect x="14" y="6" width="2" height="22" />
  </g>
  <!-- Wordmark -->
  <text x="36" y="24" font-family="Roboto, 'open sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f06292">Mangarr</text>
</svg>
